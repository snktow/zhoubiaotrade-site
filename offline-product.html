<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Produto — LojaAO</title>
<style>
:root{--brand:#0b6b3a;--brand2:#f0a500;--bg:#f7f7f8;--txt:#15181c;--muted:#6b7280;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.55}
a{text-decoration:none;color:inherit}
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #e5e7eb}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;height:64px;gap:14px}
.logo{font-weight:800;font-size:20px;color:var(--brand)}
.logo span{color:var(--brand2)}
.back{margin-left:auto;font-size:14px;color:var(--muted)}
.cartbtn{position:relative;border:1px solid #e5e7eb;border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;background:#fff}
.cartbtn b{position:absolute;top:-7px;right:-7px;background:var(--brand2);color:#1a1a1a;border-radius:999px;font-size:11px;padding:1px 6px}
main{padding:22px 0 50px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:28px;background:#fff;border-radius:var(--radius);padding:22px;border:1px solid #eceef1}
@media(max-width:720px){.pgrid{grid-template-columns:1fr;gap:18px}}
.heroimg{aspect-ratio:1;background:#eef0f2;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:90px}
h1{font-size:22px;line-height:1.3;margin-bottom:8px}
.meta{font-size:13px;color:var(--muted);margin-bottom:14px}
.price{font-size:30px;font-weight:800;color:var(--brand);margin:10px 0 2px}
.cost-note{font-size:12px;color:var(--muted);margin-bottom:16px}
.row{display:flex;gap:8px;margin-bottom:10px;font-size:14px}
.row b{color:var(--muted);font-weight:600;min-width:88px}
.badge{display:inline-block;background:#e8f5ee;color:var(--brand);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;margin-bottom:12px}
.badge.no{background:#f3f4f6;color:#9aa1a9}
.btn{display:block;width:100%;text-align:center;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}
.btn.alt{background:var(--brand2);color:#1a1a1a}
.btn[disabled]{background:#e5e7eb;color:#9aa1a9;cursor:not-allowed}
.qtyrow{display:flex;align-items:center;gap:10px;margin-top:12px}
.qtyrow button{width:34px;height:34px;border:1px solid #ddd;background:#fff;border-radius:8px;font-size:18px;cursor:pointer}
.qtyrow span{min-width:30px;text-align:center;font-weight:700}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#15181c;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:200;transition:.25s;opacity:0}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<header><div class="wrap top">
  <div class="logo">Loja<span>AO</span></div>
  <a class="back" href="index.html">← Voltar à loja</a>
  <button class="cartbtn" onclick="location.href='index.html'">🛒 <b id="cartCount">0</b></button>
</div></header>

<main class="wrap">
  <div class="pgrid" id="pgrid"><div style="color:#6b7280">Carregando...</div></div>
</main>
<div class="toast" id="toast"></div>

<script>
const RATE=175.44, MARKUP=3.0;
const money = aoa => new Intl.NumberFormat('pt-AO',{maximumFractionDigits:0}).format(aoa)+' Kz';
let P=null;
const qs=new URLSearchParams(location.search);
let cart = JSON.parse(localStorage.getItem('lojaao_cart')||'[]');

function emoji(n){n=(n||'').toLowerCase();
  if(/耳机|ouvido/.test(n))return'🎧'; if(/音箱|speaker/.test(n))return'🔊';
  if(/时钟|clock/.test(n))return'⏰'; if(/游戏|consola/.test(n))return'🎮';
  if(/香水|perfume/.test(n))return'💐'; if(/锯|serra/.test(n))return'🪚';
  if(/钳|alicate/.test(n))return'🔧'; if(/包|bolsa|carteira/.test(n))return'👛';
  if(/眼镜|oculos/.test(n))return'🕶️'; if(/美容|brush/.test(n))return'💇'; return'📦';
}
function renderCount(){ document.getElementById('cartCount').textContent = cart.reduce((a,c)=>a+c.qty,0); }

P = (DATA.products||[]).find(x=>x.sku===qs.get('sku'));
if(!P){
  document.getElementById('pgrid').innerHTML='<div>Produto não encontrado. <a href="index.html">Voltar</a></div>';
} else {
  const stock=parseInt(P.stock||'0',10), ok=stock>0;
  const price=Math.round(parseFloat(P.cost||'0')*MARKUP*RATE);
  document.title=P.name+' — LojaAO';
  document.getElementById('pgrid').innerHTML=`
    <div class="heroimg">${emoji(P.name)}</div>
    <div>
      <h1>${P.name}</h1>
      <div class="meta">SKU: ${P.sku} · ${P.spu||''}</div>
      <div class="badge ${ok?'':'no'}">${ok? '✔ Em stock ('+stock+' un.)' : 'Esgotado'}</div>
      <div class="price">${money(price)}</div>
      <div class="cost-note">Preço final em Kwanzas (AOA). Entrega em Angola.</div>
      <div class="row"><b>Especificações</b><span>${P.spec||'—'}</span></div>
      <div class="row"><b>Garantia</b><span>Produto verificado, stock local</span></div>
      ${ok?`<div class="qtyrow"><span>Qtd:</span><button onclick="chg(-1)">−</button><span id="qty">1</span><button onclick="chg(1)">+</button></div>
        <button class="btn" onclick="addNow()">Adicionar ao carrinho</button>`
        :`<button class="btn" disabled>Esgotado</button>`}
      <button class="btn alt" onclick="waNow()">Perguntar por WhatsApp</button>
    </div>`;
  renderCount();
}
function chg(d){ const el=document.getElementById('qty'); const max=parseInt(P.stock||'1',10);
  el.textContent=Math.max(1,Math.min(parseInt(el.textContent)+d,max)); }
function addNow(){
  const q=parseInt(document.getElementById('qty').textContent);
  const it=cart.find(c=>c.sku===P.sku);
  if(it) it.qty=Math.min(it.qty+q, parseInt(P.stock,10)); else cart.push({sku:P.sku,name:P.name,price:Math.round(parseFloat(P.cost)*MARKUP*RATE),qty:q});
  localStorage.setItem('lojaao_cart',JSON.stringify(cart));
  renderCount();
  const t=document.getElementById('toast'); t.textContent='Adicionado ao carrinho!'; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),1600);
}
function waNow(){ window.open('https://wa.me/?text='+encodeURIComponent('Olá! Tenho interesse em: '+P.name+' (SKU '+P.sku+')'),'_blank'); }
</script>
