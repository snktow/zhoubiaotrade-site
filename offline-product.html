<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Produto — ZhouBiaoTrade</title>
<style>
:root{--brand:#0b6b3a;--brand2:#f0a500;--bg:#f7f7f8;--txt:#15181c;--muted:#6b7280;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.55}
a{text-decoration:none;color:inherit}
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #e5e7eb}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;height:64px;gap:14px}
.logo{font-weight:800;font-size:20px;color:var(--brand)}
.logo span{color:var(--brand2)}
.back{margin-left:auto;font-size:14px;color:var(--muted)}
main{padding:22px 0 50px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:28px;background:#fff;border-radius:var(--radius);padding:22px;border:1px solid #eceef1}
@media(max-width:720px){.pgrid{grid-template-columns:1fr;gap:18px}}
.heroimg{aspect-ratio:1;background:#eef0f2;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:90px}
h1{font-size:22px;line-height:1.3;margin-bottom:8px}
.meta{font-size:13px;color:var(--muted);margin-bottom:14px}
.price{font-size:30px;font-weight:800;color:var(--brand);margin:10px 0 2px}
.cost-note{font-size:12px;color:var(--muted);margin-bottom:16px}
.row{display:flex;gap:8px;margin-bottom:10px;font-size:14px}
.row b{color:var(--muted);font-weight:600;min-width:88px}
.badge{display:inline-block;background:#e8f5ee;color:var(--brand);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;margin-bottom:12px}
.badge.no{background:#f3f4f6;color:#9aa1a9}
.btn{display:block;width:100%;text-align:center;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}
.btn.alt{background:var(--brand2);color:#1a1a1a}
.btn[disabled]{background:#e5e7eb;color:#9aa1a9;cursor:not-allowed}
.form{background:#fff;border:1px solid #eceef1;border-radius:var(--radius);padding:20px;margin-top:20px;display:none}
.form h2{font-size:17px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,textarea{width:100%;border:1px solid #dfe3e8;border-radius:9px;padding:11px;font-size:15px;font-family:inherit;outline:none}
input:focus{border-color:var(--brand)}
.ok{background:#e8f5ee;border:1px solid #b7e0c9;color:#0b6b3a;border-radius:10px;padding:14px;font-size:14px;margin-top:14px;display:none}
.err{color:#b91c1c;font-size:13px;margin-top:8px;display:none}
</style>
</head>

    <label>Província / Cidade *</label><input id="ccity" placeholder="Luanda">
    <label>Endereço de entrega</label><input id="caddr" placeholder="Rua, número, referência">
    <label>Quantidade</label><input id="cqty" type="number" min="1" value="1">
    <div class="err" id="err">Preencha nome, telefone e cidade.</div>
    <button class="btn" onclick="submitOrder()">Confirmar pedido</button>
    <div class="btn alt" onclick="waOrder()" style="margin-top:8px">Pedir via WhatsApp</div>
    <div class="ok" id="ok"></div>
  </div>
</main>

<script>
const RATE=175.44, MARKUP=3.0;
let P=null, ORDER=null;
const money = new Intl.NumberFormat('pt-AO',{maximumFractionDigits:0});
const qs = new URLSearchParams(location.search);

function emoji(n){n=(n||'').toLowerCase();
  if(/耳机|ouvido/.test(n))return'🎧'; if(/音箱|speaker/.test(n))return'🔊';
  if(/时钟|clock/.test(n))return'⏰'; if(/游戏|consola/.test(n))return'🎮';
  if(/香水|perfume/.test(n))return'💐'; if(/锯|serra/.test(n))return'🪚';
  if(/钳|alicate/.test(n))return'🔧'; if(/包|bolsa|carteira/.test(n))return'👛';
  if(/眼镜|oculos/.test(n))return'🕶️'; if(/美容|brush/.test(n))return'💇'; return'📦';
}

const d=DATA;
  P = d.products.find(x=>x.sku===qs.get('sku'));
  if(!P){ document.getElementById('pgrid').innerHTML='<div>Produto não encontrado.</div>'; return; }
  const stock = parseInt(P.stock||'0',10), ok = stock>0;
  const price = Math.round(parseFloat(P.cost||'0')*MARKUP*RATE);
  document.title = P.name + ' — ZhouBiaoTrade';
  document.getElementById('pgrid').innerHTML = `
    <div class="heroimg">${emoji(P.name)}</div>
    <div>
      <h1>${P.name}</h1>
      <div class="meta">SKU: ${P.sku} · ${P.spu||''}</div>
      <div class="badge ${ok?'':'no'}">${ok? '✔ Em stock ('+stock+' un.)' : 'Esgotado'}</div>
      <div class="price">${money.format(price)} Kz</div>
      <div class="cost-note">Preço final em Kwanzas (AOA). Entrega em Angola.</div>
      <div class="row"><b>Especificações</b><span>${P.spec||'—'}</span></div>
      <div class="row"><b>Tipo</b><span>${P.buyType||'—'}</span></div>
      <div class="row"><b>Garantia</b><span>Produto verificado, stock local</span></div>
      <button class="btn" ${ok?'':'disabled'} onclick="showForm()">${ok?'Comprar agora':'Esgotado'}</button>
      <button class="btn alt" onclick="waOrder()">Falar no WhatsApp</button>
    </div>`;
}).catch(()=>{ document.getElementById('pgrid').innerHTML='<div>Erro ao carregar.</div>'; });

function showForm(){ document.getElementById('form').style.display='block'; document.getElementById('form').scrollIntoView({behavior:'smooth'}); }
function waOrder(){
  const t = P ? `Olá! Tenho interesse em: ${P.name} (SKU ${P.sku})` : 'Olá!';
  window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
}
function submitOrder(){
  const name=document.getElementById('cname').value.trim();
  const phone=document.getElementById('cphone').value.trim();
  const city=document.getElementById('ccity').value.trim();
  const addr=document.getElementById('caddr').value.trim();
  const qty=Math.max(1,parseInt(document.getElementById('cqty').value||'1',10));
  const err=document.getElementById('err');
  if(!name||!phone||!city){ err.style.display='block'; return; }
  err.style.display='none';
  const price = Math.round(parseFloat(P.cost)*MARKUP*RATE);
  ORDER = { id:'ZB'+Date.now().toString().slice(-8), sku:P.sku, name:P.name, qty, unit:price, total:price*qty,
            customer:{name,phone,city,addr}, ts:new Date().toISOString() };
  const list = JSON.parse(localStorage.getItem('zb_orders')||'[]'); list.push(ORDER);
  localStorage.setItem('zb_orders', JSON.stringify(list));
  const ok=document.getElementById('ok');
  ok.style.display='block';
  ok.innerHTML = `✅ Pedido <b>${ORDER.id}</b> registado!<br>Produto: ${ORDER.name} × ${qty}<br>Total: <b>${money.format(ORDER.total)} Kz</b><br><br>Vamos contactá-lo pelo telefone <b>${phone}</b> para confirmar o pagamento e a entrega.`;
  ok.scrollIntoView({behavior:'smooth'});
}
